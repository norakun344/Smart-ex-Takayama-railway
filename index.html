<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takayama EX</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f6ff;
  margin:0;
}
header{
  background:#003366;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}
.card{
  background:white;
  max-width:400px;
  margin:30px auto;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
input, select{
  width:100%;
  padding:8px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:10px;
  background:#003366;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}
#result{
  margin-top:15px;
  font-weight:bold;
}
canvas{
  margin-top:15px;
}
</style>
</head>

<body>

<header>Takayama EX</header>

<div class="card">
  <input id="name" placeholder="お名前">
  <input id="email" placeholder="メールアドレス">
  <select id="train">
    <option>特急ひだ</option>
    <option>快速たかやま</option>
  </select>
  <input id="date" type="date">
  <button onclick="reserve()">予約する</button>
  <div id="result"></div>
  <canvas id="qrcode"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

/* 🔥 Firebase設定 */
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_CONFIG",
  authDomain: "YOUR_FIREBASE_CONFIG",
  projectId: "YOUR_FIREBASE_CONFIG",
  storageBucket: "YOUR_FIREBASE_CONFIG",
  messagingSenderId: "YOUR_FIREBASE_CONFIG",
  appId: "YOUR_FIREBASE_CONFIG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔥 EmailJS初期化 */
emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");

window.reserve = async function(){

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const train = document.getElementById("train").value;
  const date = document.getElementById("date").value;

  if(!name || !email || !date){
    alert("全て入力してください");
    return;
  }

  try{

    /* Firestore保存 */
    await addDoc(collection(db,"reservations"),{
      name:name,
      email:email,
      train:train,
      date:date,
      created:new Date()
    });

    /* ユーザー通知 */
    await emailjs.send(
      "YOUR_SERVICE_ID",
      "USER_TEMPLATE_ID",
      {
        name:name,
        to_email:email,
        train:train,
        date:date
      }
    );

    /* 管理者通知 */
    await emailjs.send(
      "YOUR_SERVICE_ID",
      "ADMIN_TEMPLATE_ID",
      {
        name:name,
        to_email:email,
        train:train,
        date:date
      }
    );

    /* QRコード生成 */
    QRCode.toCanvas(
      document.getElementById("qrcode"),
      name + "-" + train + "-" + date
    );

    document.getElementById("result").innerText =
      "予約完了！確認メールを送信しました。";

  }catch(e){
    alert("エラーが発生しました");
    console.log(e);
  }
}

</script>

</body>
</html>
