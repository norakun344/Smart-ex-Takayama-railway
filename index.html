<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロブ鉄 SmartEX - ログイン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>ロブ鉄 SmartEX</h1>

  <h2>ログイン</h2>
  <input type="email" id="loginEmail" placeholder="メールアドレス">
  <input type="password" id="loginPass" placeholder="パスワード">
  <button onclick="login()">ログイン</button>

  <hr>

  <h2>アカウント作成</h2>
  <input type="email" id="registerEmail" placeholder="メールアドレス">
  <input type="password" id="registerPass" placeholder="パスワード">
  <button onclick="register()">新規登録</button>

  <p id="message"></p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
