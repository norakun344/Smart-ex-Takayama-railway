<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takayama EX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Takayama EX</h1>

    <div class="tabs">
      <button class="tab active" onclick="showLogin()">ログイン</button>
      <button class="tab" onclick="showRegister()">新規登録</button>
    </div>

    <div id="loginBox">
      <input type="email" id="loginEmail" placeholder="メールアドレス">
      <input type="password" id="loginPass" placeholder="パスワード">
      <button class="primary" onclick="login()">ログイン</button>
    </div>

    <div id="registerBox" style="display:none;">
      <input type="email" id="registerEmail" placeholder="メールアドレス">
      <input type="password" id="registerPass" placeholder="パスワード">
      <button class="primary" onclick="register()">アカウント作成</button>
    </div>

    <p id="message" class="message"></p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
