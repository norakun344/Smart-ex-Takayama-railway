<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takayama EX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

  <header>
    <div class="logo"> Takayama EX</div>
  </header>

  <main class="login-box">

    <h2>ログイン</h2>

    <div class="form-group">
      <label>会員ID</label>
      <input type="text" id="memberId" placeholder="TKXから始まる番号">
    </div>

    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="password" placeholder="パスワード">
    </div>

    <button id="loginBtn" class="main-btn">ログイン</button>

    <p id="message"></p>

    <div class="links">
      <a href="register.html">会員登録はこちら</a>
    </div>

  </main>

  <footer>
    <small>© Takayama Railway</small>
  </footer>

</div>

<script type="module">
import { db } from "./firebase.js";
import { doc, getDoc } from
"https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

document.getElementById("loginBtn").addEventListener("click", async () => {

  const id = document.getElementById("memberId").value.trim();
  const pass = document.getElementById("password").value.trim();
  const msg = document.getElementById("message");

  if (!id || !pass) {
    msg.textContent = "入力してください";
    return;
  }

  const snap = await getDoc(doc(db, "members", id));

  if (snap.exists() && snap.data().password === pass) {
    localStorage.setItem("memberId", id);
    msg.textContent = "ログイン成功";
    setTimeout(() => location.href = "reserve.html", 1000);
  } else {
    msg.textContent = "ログイン失敗";
  }

});
</script>

</body>
</html>
