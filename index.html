<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Takayama EX</title>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{background:#001f3f;color:white;text-align:center;font-family:sans-serif;}
.box{background:#002b55;padding:20px;margin:20px;border-radius:15px;}
button{padding:10px 20px;border:none;border-radius:10px;background:#00c3ff;color:white;}
.seat{display:inline-block;width:40px;height:40px;margin:5px;
background:gray;border-radius:5px;cursor:pointer;}
.selected{background:lime;}
</style>
</head>

<body>

<h1>🚄 Takayama EX</h1>

<div class="box">
<h2>会員登録</h2>
<input id="regName" placeholder="名前">
<input id="regPass" type="password" placeholder="パスワード">
<button onclick="register()">登録</button>
<p id="regResult"></p>
</div>

<div class="box">
<h2>ログイン</h2>
<input id="loginId" placeholder="会員番号">
<input id="loginPass" type="password" placeholder="パスワード">
<button onclick="login()">ログイン</button>
<p id="loginResult"></p>
</div>

<div class="box" id="reserveBox" style="display:none;">
<h2>予約</h2>
<input id="from" placeholder="出発">
<input id="to" placeholder="到着">
<input id="date" type="date">

<h3>座席選択</h3>
<div id="seats"></div>

<button onclick="reserve()">予約確定</button>
<p id="reserveResult"></p>
<div id="qrcode"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "takayama-smartex.firebaseapp.com",
  projectId: "takayama-smartex"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentMember = null;
let selectedSeat = null;

// 座席生成
const seatContainer = document.getElementById("seats");
["A1","A2","B1","B2","C1","C2"].forEach(seat=>{
  const div = document.createElement("div");
  div.className="seat";
  div.innerText=seat;
  div.onclick=()=>{
    document.querySelectorAll(".seat").forEach(s=>s.classList.remove("selected"));
    div.classList.add("selected");
    selectedSeat=seat;
  };
  seatContainer.appendChild(div);
});

window.register = async function(){
  const name = regName.value;
  const pass = regPass.value;
  const memberId = "TKX" + Math.floor(100000 + Math.random()*900000);

  await setDoc(doc(db,"members",memberId),{
    name:name,
    password:pass
  });

  regResult.innerHTML="登録成功 会員番号: "+memberId;
}

window.login = async function(){
  const id = loginId.value;
  const pass = loginPass.value;

  const docSnap = await getDoc(doc(db,"members",id));
  if(docSnap.exists() && docSnap.data().password===pass){
    currentMember=id;
    loginResult.innerHTML="ログイン成功";
    reserveBox.style.display="block";
  }else{
    loginResult.innerHTML="ログイン失敗";
  }
}

window.reserve = async function(){
  if(!selectedSeat){reserveResult.innerHTML="座席選択して";return;}

  const reserveId="RSV"+Math.floor(Math.random()*1000000);

  await addDoc(collection(db,"reservations"),{
    memberId:currentMember,
    from:from.value,
    to:to.value,
    date:date.value,
    seat:selectedSeat,
    reserveId:reserveId
  });

  reserveResult.innerHTML="予約完了 予約番号:"+reserveId;

  new QRCode(document.getElementById("qrcode"),{
    text:reserveId,
    width:150,
    height:150
  });
}
</script>

</body>
</html>
