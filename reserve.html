<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>予約</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>予約</header>

<div class="box">
<input id="from" placeholder="出発駅">
<input id="to" placeholder="到着駅">
<input id="date" type="date">

<h3>座席選択</h3>
<div id="seats"></div>

<button id="reserveBtn">予約確定</button>
<p id="result"></p>
<div id="qrcode"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
import { db } from "./firebase.js";
import { addDoc, collection } from 
"https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

let selectedSeat=null;

["A1","A2","B1","B2"].forEach(seat=>{
  const div=document.createElement("div");
  div.className="seat";
  div.innerText=seat;
  div.onclick=()=>{
    document.querySelectorAll(".seat").forEach(s=>s.classList.remove("selected"));
    div.classList.add("selected");
    selectedSeat=seat;
  };
  seats.appendChild(div);
});

document.getElementById("reserveBtn").addEventListener("click", async ()=>{

  const memberId=localStorage.getItem("memberId");
  if(!memberId){
    alert("ログインしてください");
    location.href="login.html";
    return;
  }

  const reserveId="RSV"+Math.floor(Math.random()*1000000);

  await addDoc(collection(db,"reservations"),{
    memberId,
    from:from.value,
    to:to.value,
    date:date.value,
    seat:selectedSeat,
    reserveId
  });

  result.innerHTML="予約完了 予約番号:"+reserveId;

  new QRCode(qrcode,{
    text:reserveId,
    width:150,
    height:150
  });
});
</script>

</body>
</html>
