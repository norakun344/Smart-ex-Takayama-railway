<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takayama EX 会員登録</title>
<style>
body { font-family: sans-serif; background: #f2f2f2; margin:0; padding:0; }
.container { max-width: 400px; margin: 80px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
h1 { text-align:center; margin-bottom:20px; }
label { display:block; margin-top:10px; }
input { width:100%; padding:8px; margin-top:5px; box-sizing:border-box; }
button { width:100%; padding:10px; margin-top:20px; background:#0073e6; color:#fff; border:none; border-radius:4px; cursor:pointer; }
button:hover { background:#005bb5; }
#result { margin-top:20px; text-align:center; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
  <h1>会員登録</h1>
  <label for="name">名前</label>
  <input type="text" id="name" placeholder="名前を入力">

  <label for="password">パスワード</label>
  <input type="password" id="password" placeholder="パスワードを入力">

  <button id="registerBtn">登録</button>

  <div id="result"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

// Firebase 初期化
const firebaseConfig = {
  apiKey: "AIzaSyBJXGMsipD4chYb_jm7OkYRdIoOubQbak0",
  authDomain: "takayama-smartex.firebaseapp.com",
  projectId: "takayama-smartex"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("registerBtn").addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value.trim();
  const result = document.getElementById("result");

  if (!name || !password) {
    result.innerText = "名前とパスワードを入力してください";
    return;
  }

  // TKX + 8桁ランダム数字で会員番号生成
  const userId = "TKX" + Math.floor(10000000 + Math.random()*90000000);

  try {
    await addDoc(collection(db, "users"), {
      userId,
      name,
      password
    });
    result.innerHTML = `登録完了！<br>あなたの会員番号: <strong>${userId}</strong>`;
    document.getElementById("name").value = "";
    document.getElementById("password").value = "";
  } catch (e) {
    console.error(e);
    result.innerText = "登録に失敗しました";
  }
});
</script>

</body>
</html>
