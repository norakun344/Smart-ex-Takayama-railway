<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takayama EX 登録</title>
<link rel="shortcut icon" type="image/vnd.microsoft.icon" href="https://shinkansen2.jr-central.co.jp/favicon.ico">
<link rel="stylesheet" href="style.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJXGMsipD4chYb_jm7OkYRdIoOubQbak0",
  authDomain: "takayama-smartex.firebaseapp.com",
  projectId: "takayama-smartex"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function generateUserID() {
  const random = Math.floor(100000 + Math.random() * 900000); // 6桁ランダム
  return `TKX${random}`;
}

// 登録処理
window.registerUser = async function() {
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!name || !password) {
    alert("名前とパスワードを入力してください");
    return;
  }

  const userID = generateUserID();
  try {
    await setDoc(doc(db, "users", userID), {
      name: name,
      password: password
    });
    alert(`登録完了！あなたのEX IDは ${userID} です`);
    document.getElementById("registerForm").reset();
  } catch (e) {
    console.error(e);
    alert("登録に失敗しました");
  }
}

// ログイン処理
window.loginUser = async function() {
  const userID = document.getElementById("loginID").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if (!userID || !password) {
    alert("EX IDとパスワードを入力してください");
    return;
  }

  try {
    const docSnap = await getDoc(doc(db, "users", userID));
    if (!docSnap.exists()) {
      alert("EX IDが存在しません");
      return;
    }
    const data = docSnap.data();
    if (data.password === password) {
      alert(`ログイン成功！ようこそ、${data.name}さん`);
      document.getElementById("loginForm").reset();
    } else {
      alert("パスワードが間違っています");
    }
  } catch (e) {
    console.error(e);
    alert("ログインに失敗しました");
  }
}
</script>
</head>
<body>

<h2>新規登録</h2>
<form id="registerForm" onsubmit="event.preventDefault(); registerUser();">
  <label>名前</label>
  <input type="text" id="name" placeholder="名前">
  <label>パスワード</label>
  <input type="password" id="password" placeholder="パスワード">
  <button type="submit">登録</button>
</form>

<hr>

<h2>ログイン</h2>
<form id="loginForm" onsubmit="event.preventDefault(); loginUser();">
  <label>EX ID</label>
  <input type="text" id="loginID" placeholder="TKX123456">
  <label>パスワード</label>
  <input type="password" id="loginPassword" placeholder="パスワード">
  <button type="submit">ログイン</button>
</form>

</body>
</html>
